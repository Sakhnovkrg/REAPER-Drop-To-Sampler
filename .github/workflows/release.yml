name: Release

# Builds the DLL and creates a draft release. Add the release description
# (it becomes the ReaPack changelog) and publish the draft - see reapack.yml.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  DLL_ASSET: reaper_drop_to_sampler-x64.dll

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag is on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi

      - name: Build
        shell: cmd
        run: |
          > build.config.bat echo set "TOOLCHAIN=msvc"
          >> build.config.bat echo set "CMAKE_ARGS=-DDTS_VERSION=%GITHUB_REF_NAME:~1%"
          call .\build.bat

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp build/msvc/reaper_drop_to_sampler.dll "dist/$DLL_ASSET"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/$DLL_ASSET" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "dist/$DLL_ASSET" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes ""
          fi
